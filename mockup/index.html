<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TomiLite</title>
<style>
:root {
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-ja: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  --font-zh: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
}
/* ═══ Theme: Pipeline (default) ═══ */
[data-theme="pipeline"] {
  --bg: #0d0d0d; --surface: #1a1a1a; --surface2: #222; --edge: #2a2a2a;
  --ink: #f0f0f0; --muted: #888; --brand: #5E6AD2; --brand-soft: rgba(94,106,210,0.12);
  --green: #22c55e; --amber: #f59e0b; --purple: #a855f7; --blue: #3b82f6;
}
/* ═══ Theme: Hub ═══ */
[data-theme="hub"] {
  --bg: #f8f9fb; --surface: #fff; --surface2: #f0f2f5; --edge: #e4e6eb;
  --ink: #1c1e21; --muted: #65676b; --brand: #1877F2; --brand-soft: rgba(24,119,242,0.08);
  --green: #00a400; --amber: #f7a700; --purple: #8b5cf6; --blue: #1877F2;
}
/* ═══ Theme: Canvas ═══ */
[data-theme="canvas"] {
  --bg: #fff; --surface: #fafafa; --surface2: #f5f5f5; --edge: #e0e0e0;
  --ink: #202124; --muted: #5f6368; --brand: #1A73E8; --brand-soft: rgba(26,115,232,0.08);
  --green: #0d904f; --amber: #ea8600; --purple: #9334e6; --blue: #1A73E8;
}
/* ═══ Theme: Quantum ═══ */
[data-theme="quantum"] {
  --bg: #0a0e0a; --surface: #121712; --surface2: #1a1f1a; --edge: #2a3a2a;
  --ink: #d4ffd4; --muted: #6b8b6b; --brand: #76B900; --brand-soft: rgba(118,185,0,0.12);
  --green: #76B900; --amber: #b8a000; --purple: #9b59b6; --blue: #3498db;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--ink); height:100vh; display:flex; overflow:hidden; }
body[lang="ja"] { font-family:var(--font-ja); }
body[lang="zh"] { font-family:var(--font-zh); }
button { cursor:pointer; font-family:inherit; }
::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:var(--edge); border-radius:2px; }

/* ═══ APP SHELL ═══ */
.app { width:420px; min-width:380px; height:100vh; display:flex; flex-direction:column; background:var(--bg); border-right:1px solid var(--edge); position:relative; z-index:10; transition:width .3s; }
.app.maximized { width:100vw; border-right:none; }

/* ═══ TOPBAR ═══ */
.topbar { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--edge); background:var(--surface); flex-shrink:0; }
.topbar-logo { display:flex; align-items:center; gap:8px; }
.topbar-logo svg { width:20px; height:20px; }
.topbar-logo span { font-weight:700; font-size:14px; }
.topbar-right { display:flex; align-items:center; gap:6px; }
.focus-indicator { font-size:11px; color:var(--green); display:flex; align-items:center; gap:4px; }
.focus-dot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); }

/* ═══ LANG SWITCHER ═══ */
.lang-switcher { display:flex; gap:1px; background:var(--surface2); border-radius:14px; padding:2px; }
.lang-btn { background:none; border:none; color:var(--muted); font-size:10px; padding:3px 8px; border-radius:12px; cursor:pointer; font-weight:500; transition:all .15s; }
.lang-btn:hover { color:var(--ink); }
.lang-btn.active { background:var(--brand); color:#fff; font-weight:600; }
.lang-btn.disabled { opacity:0.35; cursor:not-allowed; }

/* ═══ TOPBAR BUTTONS ═══ */
.topbar-btn { background:none; border:none; color:var(--muted); font-size:15px; padding:4px 6px; border-radius:4px; }
.topbar-btn:hover { color:var(--ink); background:var(--surface2); }

/* ═══ VIEWPORT ═══ */
.viewport { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }

/* ─── CHAT ─── */
.chat-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.chat-messages { flex:1; overflow-y:auto; padding:12px; }
.chat-input-area { padding:8px 12px; border-top:1px solid var(--edge); display:flex; gap:8px; align-items:flex-end; background:var(--surface); }
.chat-input-area input { flex:1; background:var(--bg); border:1px solid var(--edge); border-radius:20px; padding:9px 16px; color:var(--ink); font-size:13px; font-family:inherit; outline:none; }
.chat-input-area input::placeholder { color:var(--muted); }
.chat-input-area input:focus { border-color:var(--brand); }
.btn-send { background:var(--brand); color:#fff; border:none; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.btn-plus { background:var(--surface2); color:var(--muted); border:1px solid var(--edge); border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; transition:all .15s; }
.btn-plus:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-soft); }

/* ─── MESSAGES ─── */
.msg { margin-bottom:10px; display:flex; gap:8px; font-size:12px; line-height:1.55; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.msg.user { justify-content:flex-end; }
.msg.user .bubble { background:var(--brand); color:#fff; border-radius:14px 14px 4px 14px; }
.msg.assistant .bubble { background:var(--surface2); color:var(--ink); border-radius:14px 14px 14px 4px; }
.msg .bubble { padding:8px 12px; max-width:88%; }
.msg .bubble p { margin:0; } .msg .bubble p+p { margin-top:4px; }
.msg .bubble strong { color:var(--ink); }
.msg .bubble code { background:rgba(0,0,0,0.3); padding:1px 5px; border-radius:3px; font-size:10px; }
.msg .tool-tag { font-size:10px; color:var(--purple); background:rgba(168,85,247,0.12); padding:2px 7px; border-radius:3px; margin-top:4px; display:inline-block; }

/* ─── WELCOME ─── */
.welcome { text-align:center; padding:24px 12px; }
.welcome .icon { font-size:36px; margin-bottom:8px; }
.welcome h4 { font-size:15px; margin-bottom:4px; }
.welcome p { font-size:11px; color:var(--muted); margin-bottom:14px; }
.suggestions { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.suggestion { font-size:11px; padding:6px 12px; border-radius:16px; border:1px solid var(--edge); background:var(--surface2); color:var(--muted); cursor:pointer; transition:all .15s; }
.suggestion:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-soft); }

/* ─── + MENU ─── */
.menu-popup { position:absolute; bottom:60px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--edge); border-radius:12px; padding:6px; display:flex; gap:4px; flex-wrap:wrap; max-width:380px; justify-content:center; box-shadow:0 8px 30px rgba(0,0,0,0.5); z-index:50; transition:all .2s; }
.menu-popup.hidden { opacity:0; transform:translateX(-50%) translateY(10px); pointer-events:none; }
.menu-item { display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:10px; color:var(--muted); border:none; background:transparent; transition:all .15s; min-width:56px; }
.menu-item:hover { background:var(--brand-soft); color:var(--brand); }
.menu-item .mi-icon { font-size:18px; }

/* ─── CONTENT PANEL ─── */
.content-panel { position:absolute; inset:0; background:var(--bg); z-index:40; display:flex; flex-direction:column; transition:transform .25s ease; }
.content-panel.hidden { transform:translateY(100%); pointer-events:none; }
.panel-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--edge); background:var(--surface); flex-shrink:0; }
.panel-header h3 { font-size:13px; display:flex; align-items:center; gap:8px; }
.panel-body { flex:1; overflow:auto; }

/* ═══ CARDS ═══ */
.card { background:var(--surface); border:1px solid var(--edge); border-radius:var(--radius); margin:6px; }
.card-hd { padding:10px 14px; border-bottom:1px solid var(--edge); font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:space-between; }
.card-bd { padding:10px 14px; }
.card-list { padding:0; }
.card-list .row { display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--edge); font-size:11px; }
.card-list .row:last-child { border-bottom:none; }

/* ═══ UTILITY ═══ */
.badge { display:inline-flex; padding:1px 7px; border-radius:3px; font-size:10px; font-weight:500; }
.badge-todo { background:var(--surface2); color:var(--muted); }
.badge-progress { background:rgba(245,158,11,0.15); color:var(--amber); }
.badge-done { background:rgba(34,197,94,0.15); color:var(--green); }
.badge-critical { background:rgba(239,68,68,0.15); color:var(--brand); }
.badge-high { background:rgba(249,115,22,0.15); color:#f97316; }
.badge-epic { background:rgba(168,85,247,0.15); color:var(--purple); }
.stat-val { font-size:24px; font-weight:700; }
.stat-lbl { font-size:10px; color:var(--muted); margin-top:2px; }
.grid-4 { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; padding:6px; }
.flex { display:flex; } .items-center { align-items:center; } .justify-between { justify-content:space-between; }
.flex-1 { flex:1; } .flex-wrap { flex-wrap:wrap; } .gap-1 { gap:4px; } .gap-2 { gap:8px; } .gap-3 { gap:12px; }
.text-muted { color:var(--muted); font-size:10px; }
.text-sm { font-size:11px; } .text-xs { font-size:10px; }
.mt-1 { margin-top:4px; } .mt-2 { margin-top:8px; } .mt-3 { margin-top:12px; } .mb-2 { margin-bottom:8px; } .mb-3 { margin-bottom:12px; }
.hidden { display:none !important; }
.progress { height:3px; background:var(--edge); border-radius:2px; overflow:hidden; flex:1; }
.progress-bar { height:100%; background:var(--brand); border-radius:2px; }

/* ═══ KANBAN ═══ */
.kanban { display:flex; gap:6px; padding:6px; overflow-x:auto; }
.kanban-col { min-width:170px; background:var(--surface2); border-radius:var(--radius); }
.kanban-col-hd { padding:8px 10px; font-size:10px; font-weight:600; border-bottom:1px solid var(--edge); display:flex; justify-content:space-between; }
.kanban-col-bd { padding:4px; }
.kanban-card { background:var(--surface); border:1px solid var(--edge); border-radius:5px; padding:7px; margin-bottom:3px; font-size:10px; }
.kanban-card:hover { border-color:var(--brand); }

/* ═══ FORMS ═══ */
.btn { border:none; border-radius:6px; padding:5px 12px; font-size:11px; font-weight:600; display:inline-flex; align-items:center; gap:5px; }
.btn-brand { background:var(--brand); color:#fff; }
.btn-secondary { background:var(--surface); color:var(--ink); border:1px solid var(--edge); }
.btn-ghost { background:transparent; color:var(--muted); padding:4px 8px; font-size:10px; }
.btn-xs { padding:3px 7px; font-size:10px; } .btn-sm { padding:5px 10px; font-size:11px; }
.form-input, .form-select { background:var(--bg); border:1px solid var(--edge); border-radius:5px; padding:7px 10px; color:var(--ink); font-size:11px; font-family:inherit; width:100%; }
.form-textarea { background:var(--bg); border:1px solid var(--edge); border-radius:5px; padding:8px 12px; color:var(--ink); font-size:12px; font-family:inherit; width:100%; resize:vertical; min-height:100px; line-height:1.5; }
.form-label { font-size:10px; color:var(--muted); font-weight:500; margin-bottom:3px; display:block; }
.form-grp { margin-bottom:8px; }
.tabs { display:flex; gap:0; border-bottom:1px solid var(--edge); padding:0 6px; }
.tab { padding:8px 14px; font-size:11px; color:var(--muted); border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; cursor:pointer; }
.tab.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }

/* ═══ MODAL ═══ */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; display:flex; align-items:center; justify-content:center; }
.modal { background:var(--surface); border:1px solid var(--edge); border-radius:12px; width:100%; max-width:440px; max-height:75vh; overflow:auto; }
.modal-hd { padding:12px 16px; border-bottom:1px solid var(--edge); display:flex; align-items:center; justify-content:space-between; }
.modal-bd { padding:16px; }
.changelog { font-size:11px; line-height:1.6; }
.changelog h2 { font-size:13px; margin:8px 0 4px; }
.changelog ul { padding-left:14px; }
.changelog code { background:var(--surface2); padding:1px 4px; border-radius:3px; font-size:10px; }
</style>
</head>

<!-- ═══ APP ═══ -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-logo">
      <svg width="20" height="20" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#ef4444"/><circle cx="11" cy="13" r="2" fill="#fff"/><circle cx="21" cy="13" r="2" fill="#fff"/><path d="M10 20c3-3 9-3 12 0" stroke="#fff" stroke-width="1.5" fill="none"/><line x1="16" y1="2" x2="16" y2="7" stroke="#0a0" stroke-width="2"/><circle cx="16" cy="2" r="2" fill="#0a0"/></svg>
      <span data-i18n="appName">TomiLite</span>
    </div>
    <div class="topbar-right">
      <div class="focus-indicator"><span class="focus-dot"></span><span data-i18n="focusLabel">Deep Flow</span> <span id="focus-min">47m</span></div>
      <div class="lang-switcher" id="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="zh">中</button>
        <button class="lang-btn" data-lang="ja">日</button>
      </div>
      <button class="topbar-btn" id="btn-max" title="Maximize" onclick="toggleMax()">⛶</button>
    </div>
  </div>

  <div class="viewport" id="viewport">
    <div class="chat-area" id="chat-area">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <input id="chat-input" data-i18n-placeholder="chatPlaceholder" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="btn-plus" id="btn-plus" onclick="toggleMenu()" title="Menu">+</button>
        <button class="btn-send" onclick="sendMessage()">↑</button>
      </div>
    </div>

    <div class="menu-popup hidden" id="menu-popup">
      <button class="menu-item" onclick="openPanel('home')"><span class="mi-icon">🏠</span><span data-i18n="menuHome">Home</span></button>
      <button class="menu-item" onclick="openPanel('board')"><span class="mi-icon">📋</span><span data-i18n="menuBoard">Board</span></button>
      <button class="menu-item" onclick="openPanel('backlog')"><span class="mi-icon">📝</span><span data-i18n="menuBacklog">Backlog</span></button>
      <button class="menu-item" onclick="openPanel('issues')"><span class="mi-icon">🎫</span><span data-i18n="menuIssue">Issue</span></button>
      <button class="menu-item" onclick="openPanel('notes')"><span class="mi-icon">📔</span><span data-i18n="menuNotes">Notes</span></button>
      <button class="menu-item" onclick="openPanel('reports')"><span class="mi-icon">📊</span><span data-i18n="menuReports">Reports</span></button>
      <button class="menu-item" onclick="openPanel('settings')"><span class="mi-icon">⚙️</span><span data-i18n="menuSettings">Settings</span></button>
    </div>

    <div class="content-panel hidden" id="content-panel">
      <div class="panel-header"><h3 id="panel-title">📋 Panel</h3><button class="btn-ghost" onclick="closePanel()" style="font-size:16px">✕</button></div>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </div>
</div>

<!-- ═══ UPDATE MODAL ═══ -->
<div class="modal-overlay hidden" id="update-modal">
  <div class="modal">
    <div class="modal-hd"><span id="update-title">🚀 v0.2.0 Available</span><button class="btn-ghost" onclick="toggleModal('update-modal')">✕</button></div>
    <div class="modal-bd">
      <div class="changelog mb-2" id="update-changelog"></div>
      <div class="flex gap-2 justify-between"><button class="btn btn-secondary btn-sm" onclick="toggleModal('update-modal')" data-i18n="updateLater">Later</button><button class="btn btn-brand btn-sm" data-i18n="updateInstall">⬇ Download & Install</button></div>
    </div>
  </div>
</div>

// ═══ CURRENT LANGUAGE ═══
let lang = 'en';

function t(key) { return I18N[lang][key] || I18N['en'][key] || key; }

function setLang(l) {
  lang = l;
  document.body.setAttribute('lang', l);
  // Update lang buttons
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  // Update all i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  // Re-render active view
  if (panelOpen) renderPanel(currentPanelName);
  else if (msgs.querySelector('.welcome')) showWelcome();
}

document.getElementById('lang-switcher').addEventListener('click', e => {
  const btn = e.target.closest('.lang-btn');
  if (btn) setLang(btn.dataset.lang);
});

// ═══ MAXIMIZE ═══
let maximized = false;
function toggleMax() {
  maximized = !maximized;
  document.getElementById('app').classList.toggle('maximized', maximized);
  document.getElementById('btn-max').textContent = maximized ? '🗗' : '⛶';
}

// ═══ + MENU ═══
let menuOpen = false;
function toggleMenu() { menuOpen = !menuOpen; document.getElementById('menu-popup').classList.toggle('hidden', !menuOpen); }
function hideMenu() { menuOpen = false; document.getElementById('menu-popup').classList.add('hidden'); }

// ═══ CONTENT PANEL ═══
let panelOpen = false, currentPanelName = '';

function openPanel(name) {
  hideMenu(); panelOpen = true; currentPanelName = name;
  document.getElementById('content-panel').classList.remove('hidden');
  document.getElementById('chat-area').style.display = 'none';
  renderPanel(name);
}
function closePanel() {
  panelOpen = false; currentPanelName = '';
  document.getElementById('content-panel').classList.add('hidden');
  document.getElementById('chat-area').style.display = '';
}

const PROVIDER_URLS = {
  deepseek: 'https://api.deepseek.com',

  moonshot: 'https://api.moonshot.cn/v1',

const PROVIDER_MODELS = {

function updateLlmProvider() {
  const provider = document.getElementById('llm-provider').value;
  document.getElementById('llm-base-url').value = PROVIDER_URLS[provider] || '';
  const models = PROVIDER_MODELS[provider] || { flash: [], pro: [] };
  const flashSel = document.getElementById('llm-flash');
  const proSel = document.getElementById('llm-pro');
  flashSel.innerHTML = models.flash.map(m => `<option>${m}</option>`).join('') || '<option>(enter model name)</option>';
  proSel.innerHTML = models.pro.map(m => `<option>${m}</option>`).join('') || '<option>(enter model name)</option>';
}

function toggleApiKey() {
  const inp = document.getElementById('llm-api-key');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function showWelcome() {
  const s = SUGGESTIONS[lang];
  msgs.innerHTML = `
    <div class="welcome">
      <div class="icon">🍅</div>
      <h4>${t('welcomeTitle')}</h4>
      <p>${t('welcomeDesc')}</p>
      <div class="suggestions">
        <span class="suggestion" onclick="useSuggestion('${s[0]}')">${s[0]}</span>
        <span class="suggestion" onclick="useSuggestion('${s[1]}')">${s[1]}</span>
        <span class="suggestion" onclick="useSuggestion('${s[2]}')">${s[2]}</span>
        <span class="suggestion" onclick="useSuggestion('${s[3]}')">${s[3]}</span>
        <span class="suggestion" onclick="useSuggestion('${s[4]}')">${s[4]}</span>
      </div>
    </div>`;
}

function useSuggestion(text) {
  document.getElementById('chat-input').value = text;
  sendMessage();
}

function addMsg(role, text, tool) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  let h = '<div class="bubble">' + text.replace(/\n/g, '<br>');
  if (tool) h += '<span class="tool-tag">🔧 ' + tool + '</span>';
  h += '</div>';
  d.innerHTML = h;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendMessage() {
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  if (msgs.querySelector('.welcome')) msgs.innerHTML = '';
  addMsg('user', text);
  addMsg('assistant', '<span style="color:var(--muted)">' + t('thinking') + '</span>');
  setTimeout(() => {
    msgs.lastChild.remove();
    const l = text.toLowerCase();
    let resp;
    if ((l.includes('create')||l.includes('new')||l.includes('创建')||l.includes('作成'))&&(l.includes('bug')||l.includes('issue')||l.includes('task')||l.includes('缺陷')||l.includes('バグ')||l.includes('任务')||l.includes('課題'))) {
      resp = AI_RESPONSES.created;
    } else if (l.includes('report')||l.includes('daily')||l.includes('报告')||l.includes('日报')||l.includes('レポート')) {
      resp = AI_RESPONSES.report;
    } else if (l.includes('progress')||l.includes('status')||l.includes('task')||l.includes('状态')||l.includes('進捗')||l.includes('状況')||l.includes('进行中')||l.includes('進行中')) {
      resp = AI_RESPONSES.status;
    } else if (l.includes('git')||l.includes('commit')) {
      resp = AI_RESPONSES.git;
    } else if (l.includes('search')||l.includes('note')||l.includes('architecture')||l.includes('搜索')||l.includes('検索')||l.includes('笔记')||l.includes('ノート')) {
      resp = AI_RESPONSES.search;
    } else if (l.includes('story point')||l.includes('estimate')||l.includes('故事点')||l.includes('ポイント')) {
      resp = AI_RESPONSES.estimate;
    } else {
      resp = AI_RESPONSES.help;
    }
    addMsg('assistant', ...resp[lang] ? [resp[lang][0], resp[lang][1]] : [resp.en[0], resp.en[1]]);
    if (!window._updateShown) { window._updateShown = true; setTimeout(() => { if (!panelOpen) renderUpdateModal(); }, 3000); }
  }, 700);
}

function renderUpdateModal() {
  document.getElementById('update-title').textContent = t('updateTitle');
  document.getElementById('update-changelog').innerHTML = `<h2>What's New</h2><ul><li>${t('updateItem1')}</li><li>${t('updateItem2')}</li><li>${t('updateItem3')}</li><li>${t('updateItem4')}</li></ul>`;
  toggleModal('update-modal');
}
